name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-check:
    name: Version check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Require a version bump for engine changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF"
          base_version=$(git show "origin/$BASE_REF:package.json" | node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(0,'utf8').replace(/^\uFEFF/,'')).version)")
          version=$(node -p "require('./package.json').version")
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD")
          if echo "$changed" | grep -Eq '^(aihttp\.js|aihttp\.d\.ts|bin/|lib/)' && [ "$version" = "$base_version" ]; then
            echo "::error title=Version bump required::engine files changed but version is still $version. run: npm run bump -- patch"
            exit 1
          fi
          if ! grep -Eq "^## ${version}(,|$)" CHANGELOG.md; then
            echo "::error title=Changelog missing::CHANGELOG.md has no '## ${version}' heading"
            exit 1
          fi
          echo "version $version (base $base_version)"

  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['18.x', '20.x', '22.x', '26.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Playwright 1.64 requires Node >=20. The 18.x leg installs runtime files only
      # and proves that aihttp.js, lib/ and the CLI work without dev dependencies.
      - run: npm ci
        if: matrix.node != '18.x'
      - run: npm ci --omit=dev
        if: matrix.node == '18.x'
      - run: npm run build
        if: matrix.node != '18.x'
      - run: git diff --exit-code -- aihttp.min.js
        if: matrix.node != '18.x'
      - run: npm test
        if: matrix.node != '18.x'
      - run: npm run typecheck
        if: matrix.node != '18.x'
      - run: npm run lint
        if: matrix.node != '18.x'
      - run: node scripts/smoke-runtime.js
        if: matrix.node == '18.x'
      - run: npm audit --omit=dev
      - run: npm pack --dry-run

  browser:
    name: Chromium integration
    runs-on: ubuntu-latest
    env:
      AIHTTP_REQUIRE_BROWSER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  benchmark:
    name: Benchmark smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:bench
