name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['18.x', '20.x', '22.x', '26.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Playwright 1.64 requires Node >=20. The 18.x leg installs runtime files only
      # and proves that ahttp.js, lib/ and the CLI work without dev dependencies.
      - run: npm ci
        if: matrix.node != '18.x'
      - run: npm ci --omit=dev
        if: matrix.node == '18.x'
      - run: npm run build
        if: matrix.node != '18.x'
      - run: git diff --exit-code -- ahttp.min.js
        if: matrix.node != '18.x'
      - run: npm test
        if: matrix.node != '18.x'
      - run: npm run typecheck
        if: matrix.node != '18.x'
      - run: npm run lint
        if: matrix.node != '18.x'
      - run: node scripts/smoke-runtime.js
        if: matrix.node == '18.x'
      - run: npm audit --omit=dev
      - run: npm pack --dry-run

  browser:
    name: Chromium integration
    runs-on: ubuntu-latest
    env:
      AHTTP_REQUIRE_BROWSER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  benchmark:
    name: Benchmark smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:bench
