name: Feature request
description: Propose a concrete change
title: "[feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The smallest change that would solve it.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: A page, a fixture, a command, or a measurement. Do not include secrets.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Browser engine
        - Static MCP backend
        - Browser backend
        - CLI
        - Benchmark
        - Documentation
        - Packaging
