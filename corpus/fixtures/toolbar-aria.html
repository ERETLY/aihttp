<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Editor</title></head>
<body>
<main>
<div role="toolbar">
<button aria-label="Bold" onclick="window.__mark('Bold')"><svg width="16" height="16"></svg></button>
<button aria-label="Italic" onclick="window.__mark('Italic')"><svg width="16" height="16"></svg></button>
<button aria-label="Underline" onclick="window.__mark('Underline')"><svg width="16" height="16"></svg></button>
</div>
<p id="out">idle</p>
<script>
window.__mark = function (value) { var out = document.getElementById("out"); if (out) out.textContent = value; };
</script>
</main>
</body>
</html>
