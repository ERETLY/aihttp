<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Links</title></head>
<body>
<main>
<div id="app">
<a href="/a" onclick="event.preventDefault(); window.__mark('a')">Docs</a>
<a href="/b" onclick="event.preventDefault(); window.__mark('b')">Docs</a>
</div>
<p id="out">idle</p>
<script>
window.__mark = function (value) { var out = document.getElementById("out"); if (out) out.textContent = value; };
</script>
</main>
</body>
</html>
