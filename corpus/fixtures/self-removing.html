<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Self removing</title></head>
<body>
<main>
<button onclick="this.remove(); window.__mark('gone')">Remove me</button>
<p id="out">idle</p>
<script>
window.__mark = function (value) { var out = document.getElementById("out"); if (out) out.textContent = value; };
</script>
</main>
</body>
</html>
