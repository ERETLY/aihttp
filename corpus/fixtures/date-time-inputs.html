<!doctype html>
<html><head><meta charset="utf-8"><title>Date and time inputs</title></head><body>
<main>
  <form>
    <label>Date <input type="date" name="date" value="2026-11-07"></label>
    <label>Time <input type="time" name="time" value="13:45"></label>
    <label>Month <input type="month" name="month" value="2026-11"></label>
    <label>Week <input type="week" name="week" value="2026-W45"></label>
    <label>Range <input type="range" name="range" min="0" max="10" value="7"></label>
    <label>Number <input type="number" name="count" value="3"></label>
    <label>Color <input type="color" name="color" value="#336699"></label>
    <button>Apply</button>
  </form>
</main>
</body></html>
