<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Editor</title></head>
<body>
<main>
<div role="toolbar">
<button title="Copy link" onclick="window.__mark('copied')"><svg width="16" height="16"></svg></button>
<button title="Download" onclick="window.__mark('downloaded')"><svg width="16" height="16"></svg></button>
</div>
<p id="out">idle</p>
<script>
window.__mark = function (value) { var out = document.getElementById("out"); if (out) out.textContent = value; };
</script>
</main>
</body>
</html>
