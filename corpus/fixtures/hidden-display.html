<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Visibility</title></head>
<body>
<main>
<button onclick="window.__mark('go')">Go</button>
<button style="display:none" onclick="window.__mark('hidden')">Hover</button>
<p id="out">idle</p>
<script>
window.__mark = function (value) { var out = document.getElementById("out"); if (out) out.textContent = value; };
</script>
</main>
</body>
</html>
