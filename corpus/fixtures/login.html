<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Sign in</title></head>
<body>
<main>
<h1>Sign in</h1>
<form>
<label for="email">Email</label>
<input id="email" name="email" type="email" placeholder="you@example.com">
<label for="password">Password</label>
<input id="password" name="password" type="password">
<button id="submit" type="submit" onclick="event.preventDefault(); window.__mark('Welcome back')">Sign in</button>
</form>
<p id="out">idle</p>
<script>
window.__mark = function (value) { var out = document.getElementById("out"); if (out) out.textContent = value; };
</script>
</main>
</body>
</html>
