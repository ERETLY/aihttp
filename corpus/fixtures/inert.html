<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Inert</title></head>
<body>
<main>
<div inert><button onclick="window.__mark('inert-child')">Inert child</button></div>
<button inert onclick="window.__mark('inert-self')">Inert self</button>
<button onclick="window.__mark('normal')">Normal</button>
<p id="out">idle</p>
<script>
window.__mark = function (value) { var out = document.getElementById("out"); if (out) out.textContent = value; };
</script>
</main>
</body>
</html>
