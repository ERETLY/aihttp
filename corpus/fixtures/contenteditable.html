<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Note</title></head>
<body>
<main>
<div contenteditable="true" aria-label="Note" oninput="window.__mark(this.textContent)"></div>
<p id="out">idle</p>
<script>
window.__mark = function (value) { var out = document.getElementById("out"); if (out) out.textContent = value; };
</script>
</main>
</body>
</html>
