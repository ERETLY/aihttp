<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Custom checkbox</title></head>
<body>
<main>
<label>
  <input type="checkbox" id="agree" style="position:absolute;opacity:0">
  <span class="box"></span> I agree to the terms
</label>
<button onclick="window.__mark('continued')">Continue</button>
<p id="out">idle</p>
<script>
window.__mark = function (value) {
  var out = document.getElementById('out');
  if (out) out.textContent = value;
};
document.getElementById('agree').addEventListener('change', function () {
  window.__mark(this.checked ? 'checked' : 'unchecked');
});
</script>
</main>
</body>
</html>
