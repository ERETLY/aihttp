<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Run with testid</title></head>
<body>
<main>
<div id="app"><button data-testid="run" onclick="window.__mark('orig')">Run</button></div>
<p id="out">idle</p>
<script>
window.__mark = function (value) { var out = document.getElementById('out'); if (out) out.textContent = value; };
</script>
</main>
</body>
</html>
