<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Pointer</title></head>
<body>
<main>
<button style="pointer-events:none">Unclickable</button>
<button>Clickable</button>
<p id="out">idle</p>
<script>
window.__mark = function (value) { var out = document.getElementById("out"); if (out) out.textContent = value; };
</script>
</main>
</body>
</html>
