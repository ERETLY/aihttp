<!doctype html>
<html><head><meta charset="utf-8"><title>Select multiple</title></head><body>
<main>
  <label for="tags">Tags</label>
  <select id="tags" name="tags" multiple size="4">
    <option value="a" selected>Alpha</option>
    <option value="b">Beta</option>
    <option value="c" selected>Gamma</option>
    <option value="d" disabled>Delta</option>
  </select>
  <label>Country <select name="country"><option>Choose one</option><option>UK</option></select></label>
  <button>Save</button>
</main>
</body></html>
