<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Visibility</title></head>
<body>
<main>
<div aria-hidden="true"><button onclick="window.__mark('secret')">Secret</button></div>
<button onclick="window.__mark('visible')">Visible</button>
<p id="out">idle</p>
<script>
window.__mark = function (value) { var out = document.getElementById("out"); if (out) out.textContent = value; };
</script>
</main>
</body>
</html>
