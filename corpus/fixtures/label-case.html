<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Label case</title></head>
<body>
<main>
<button onclick="window.__mark('loose')">ok</button>
<button onclick="window.__mark('exact')">OK</button>
<p id="out">idle</p>
<script>
window.__mark = function (value) { var out = document.getElementById('out'); if (out) out.textContent = value; };
</script>
</main>
</body>
</html>
