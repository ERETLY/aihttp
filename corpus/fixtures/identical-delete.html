<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Rows</title></head>
<body>
<main>
<table><tbody id="rows">
<tr><td>Alpha</td><td><button onclick="window.__del(this)">Delete</button></td></tr>
<tr><td>Beta</td><td><button onclick="window.__del(this)">Delete</button></td></tr>
</tbody></table>
<p id="out">idle</p>
<script>
window.__mark = function (v) { document.getElementById("out").textContent = v; };
window.__del = function (btn) { var tr = btn.closest("tr"); if (tr) tr.remove(); window.__mark("deleted"); };
</script>
</main>
</body>
</html>
