<!doctype html>
<html><head><meta charset="utf-8"><title>ARIA tabs</title></head><body>
<main>
  <div role="tablist" aria-label="Settings">
    <button role="tab" aria-selected="true" aria-controls="panel-general" id="tab-general">General</button>
    <button role="tab" aria-selected="false" aria-controls="panel-billing" id="tab-billing" tabindex="-1">Billing</button>
  </div>
  <div role="tabpanel" id="panel-general" aria-labelledby="tab-general" tabindex="0">
    <label>Workspace name <input name="workspace"></label>
  </div>
  <div role="tabpanel" id="panel-billing" aria-labelledby="tab-billing" hidden>
    <button>Manage plan</button>
  </div>
</main>
</body></html>
