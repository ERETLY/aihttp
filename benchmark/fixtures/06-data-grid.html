<!doctype html>
<html>
<head><title>Data Grid</title></head>
<body>
<main>
  <h1>Users</h1>
  <label for="filter">Filter</label>
  <input id="filter" name="filter" placeholder="Search users">
  <button id="sort">Sort by score</button>
  <button id="prev">Prev</button>
  <button id="next">Next</button>
  <p id="info"></p>
  <table>
    <thead><tr><th>Name</th><th>Score</th><th>Status</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</main>
<script>
var data = [];
for (var i = 0; i < 50; i++) {
  data.push({
    name: 'User ' + (i + 1),
    score: (i * 37) % 100,
    status: i % 3 === 0 ? 'active' : 'idle'
  });
}
var state = { q: '', sort: false, page: 0 };
function render() {
  var rows = data.filter(function (d) {
    return d.name.toLowerCase().indexOf(state.q.toLowerCase()) >= 0;
  });
  if (state.sort) rows = rows.slice().sort(function (a, b) { return b.score - a.score; });
  var per = 10;
  var pages = Math.max(1, Math.ceil(rows.length / per));
  state.page = Math.min(state.page, pages - 1);
  var pageRows = rows.slice(state.page * per, state.page * per + per);
  document.getElementById('rows').innerHTML = pageRows.map(function (d) {
    return '<tr><td>' + d.name + '</td><td>' + d.score + '</td><td>' + d.status + '</td></tr>';
  }).join('');
  document.getElementById('info').textContent =
    'Showing ' + (pageRows.length ? state.page * per + 1 : 0) + '-' +
    (state.page * per + pageRows.length) + ' of ' + rows.length +
    ' - page ' + (state.page + 1) + '/' + pages;
}
document.getElementById('filter').addEventListener('input', function () {
  state.q = this.value;
  state.page = 0;
  render();
});
document.getElementById('sort').addEventListener('click', function () {
  state.sort = !state.sort;
  render();
});
document.getElementById('prev').addEventListener('click', function () {
  state.page = Math.max(0, state.page - 1);
  render();
});
document.getElementById('next').addEventListener('click', function () {
  state.page++;
  render();
});
window.__renderGrid = render;
render();
</script>
</body>
</html>
