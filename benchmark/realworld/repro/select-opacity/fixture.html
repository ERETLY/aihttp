<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Select opacity</title>
<style>
body{font:14px sans-serif;margin:40px}
.select_container{position:relative;display:inline-block}
.active_option{display:block;width:220px;height:30px;line-height:30px;padding:0 8px;border:1px solid #ccc;cursor:pointer}
.product_sort_container{position:absolute;inset:0;width:100%;height:100%;opacity:0.001;margin:0}
</style>
</head>
<body>
<main>
<span class="select_container">
  <span class="active_option" data-test="active-option">Name (A to Z)</span>
  <select class="product_sort_container" aria-label="Sort products" data-test="product-sort-container">
    <option value="az">Name (A to Z)</option>
    <option value="za">Name (Z to A)</option>
    <option value="lohi">Price (low to high)</option>
    <option value="hilo">Price (high to low)</option>
  </select>
</span>
<p id="out">idle</p>
</main>
<script>
document.querySelector('select').addEventListener('change', function () {
  document.getElementById('out').textContent = this.value;
});
</script>
</body>
</html>
